{% if quotes %}<div class="module-head"><div class="module-no">肆</div><div class="module-title">今日金句<span class="en">THE LINES WORTH PRESERVING</span></div><div class="badge">VOICES</div></div>{% for quote in quotes %}<div class="quote-wrapper avoid-break"><div class="q-flex"><div class="q-side">{% if quote.avatar_url %}<img class="q-avatar" src="{{ quote.avatar_url }}" alt="头像">{% endif %}<div class="q-sender">{{ '神秘群友' if hide_user_names else quote.sender }}</div></div><div class="q-main"><div class="q-bubble">{{ quote.content }}</div><div class="q-note"><span class="note-label">TIMEKEEPER NOTE / </span>{{ quote.reason|safe }}</div></div></div></div>{% endfor %}{% endif %}
