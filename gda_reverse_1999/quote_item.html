{% if quotes %}<span style="display:none">金句</span><div class="scene-title"><div class="chapter-index">04 / VOICES</div><div><h2>没有被倒带的声音</h2><div class="en">THE LINES WORTH PRESERVING</div></div></div>{% for quote in quotes %}<div class="quote-wrapper avoid-break"><div class="q-flex"><div class="q-side">{% if quote.avatar_url %}<img class="q-avatar" src="{{ quote.avatar_url }}" alt="头像">{% endif %}<div class="q-sender">{{ '神秘群友' if hide_user_names else quote.sender }}</div></div><div class="q-main"><div class="q-bubble">{{ quote.content }}</div><div class="q-note"><span class="note-label">TIMEKEEPER NOTE / </span>{{ quote.reason|safe }}</div></div></div></div>{% endfor %}{% endif %}
