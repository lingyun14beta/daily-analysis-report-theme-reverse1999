{% if quotes %}
<div class="section-title">今日金句 · 留声机</div>
<div class="section-sub">THE GRAMOPHONE · 值得倒带重听</div>
{% for quote in quotes %}
<div class="quote-wrapper avoid-break">
    <div class="q-flex">
        {% if quote.avatar_url %}
        <img class="q-avatar" src="{{ quote.avatar_url }}" alt="头像">
        {% endif %}
        <div style="flex: 1; min-width: 0;">
            <div class="q-sender">{{ quote.sender }}</div>
            <div class="q-bubble">{{ quote.content }}</div>
            <div class="q-note"><span class="note-label">✒ 观测员批注：</span>{{ quote.reason | safe }}</div>
        </div>
    </div>
</div>
{% endfor %}
{% endif %}
